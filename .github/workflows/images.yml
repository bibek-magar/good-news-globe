name: Fetch free photos
on:
  push:
    paths: ["posts/**/stories.json"]
  workflow_dispatch:
    inputs:
      folder:
        description: "Folder, e.g. posts/2026-10-02-midday"
        required: true
permissions:
  contents: write
concurrency: { group: images, cancel-in-progress: false }
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests pillow
      - name: Fetch candidates
        run: |
          if [ -n "${{ github.event.inputs.folder }}" ]; then f="${{ github.event.inputs.folder }}"
          else f=$(git diff --name-only HEAD~1 HEAD -- 'posts/*/stories.json' | xargs -r -n1 dirname | sort -u); fi
          for d in $f; do [ -f "$d/POSTED" ] && [ -z "${{ github.event.inputs.folder }}" ] && continue; python fetch_images.py "$d"; done
      - name: Commit
        run: |
          git config user.name "ggn-bot"; git config user.email "ggn-bot@users.noreply.github.com"
          git add posts/*/img 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Photo candidates [skip ci]" && git pull --rebase -q && git push)
