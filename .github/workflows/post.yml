name: Post carousel to Instagram
on:
  push:
    paths: ["posts/**/caption.txt"]
  workflow_dispatch:
    inputs:
      folder:
        description: "Folder to post, e.g. posts/2026-10-01-morning"
        required: true
permissions:
  contents: write
concurrency:
  group: instagram-post
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - name: Find new post folders
        id: find
        run: |
          if [ -n "${{ github.event.inputs.folder }}" ]; then
            echo "folders=${{ github.event.inputs.folder }}" >> $GITHUB_OUTPUT
          else
            f=$(git diff --name-only HEAD~1 HEAD -- 'posts/*/caption.txt' | xargs -r -n1 dirname | sort -u | tr '\n' ' ')
            echo "folders=$f" >> $GITHUB_OUTPUT
          fi
      # If Instagram blocks/rate-limits the account, don't keep hammering it: post_to_instagram.py exits 42
      # and we write .ig_blocked_until (now + 48 h). Runs during the cooldown skip Instagram entirely.
      # To retry sooner (e.g. after the block is lifted in the app), delete .ig_blocked_until.
      - name: Publish
        id: pub
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          FIRST_COMMENT: ${{ vars.FIRST_COMMENT }}
        run: |
          now=$(date -u +%s)
          if [ -f .ig_blocked_until ] && [ "$now" -lt "$(cat .ig_blocked_until)" ]; then
            echo "::warning::Instagram cooldown until $(date -u -d @"$(cat .ig_blocked_until)"). Not posting."
            echo "blocked=1" >> "$GITHUB_OUTPUT"; exit 0
          fi
          for f in ${{ steps.find.outputs.folders }}; do
            if [ -f "$f/POSTED" ]; then echo "$f already posted"; continue; fi
            rc=0; python post_to_instagram.py "$f" || rc=$?
            if [ "$rc" -eq 42 ]; then
              echo $((now + 172800)) > .ig_blocked_until
              echo "::error::Instagram blocked publishing. Cooling down 48 h; appeal in the Instagram app."
              echo "blocked=1" >> "$GITHUB_OUTPUT"; exit 0
            fi
            [ "$rc" -eq 0 ] || exit 1
            date -u > "$f/POSTED"; rm -f .ig_blocked_until
          done
      - name: Mark as posted
        run: |
          git config user.name "ggn-bot"; git config user.email "ggn-bot@users.noreply.github.com"
          git add posts/*/POSTED 2>/dev/null || true
          git add -A .ig_blocked_until 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Mark posted [skip ci]" && git pull --rebase -q && git push)
      # --- Reel with calm music (Reels tab only). Never blocks the carousel above. ---
      - name: Build reels
        id: reel
        if: steps.pub.outputs.blocked != '1'
        continue-on-error: true
        run: |
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          for f in ${{ steps.find.outputs.folders }}; do
            [ -f "$f/REEL_POSTED" ] || python make_reel.py "$f"
          done
      - name: Publish reels
        if: steps.pub.outputs.blocked != '1' && steps.reel.outcome == 'success'
        continue-on-error: true
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          for f in ${{ steps.find.outputs.folders }}; do
            python post_reel.py "$f" || exit 1
          done
      # Off unless the repo variable POST_STORY is "true": fewer automated actions per post = less spam risk.
      - name: Publish stories
        if: steps.pub.outputs.blocked != '1' && vars.POST_STORY == 'true'
        continue-on-error: true
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          for f in ${{ steps.find.outputs.folders }}; do
            python post_story.py "$f" || exit 1
          done
      - name: Mark reels and stories posted
        if: always()
        run: |
          git add posts/*/REEL_POSTED 2>/dev/null || true; git add posts/*/STORY_POSTED 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Mark reel/story posted [skip ci]" && git pull --rebase -q && git push)
